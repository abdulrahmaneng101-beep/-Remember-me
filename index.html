<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ذاكرتي البهية | رفيقك الذكي لاسترجاع ذكرياتك</title>
    
    <!-- ربط ملف الـ Manifest لتعريف التطبيق -->
    <link rel="manifest" href="manifest.json">
    
    <!-- أيقونة المتصفح -->
    <link rel="icon" href="https://img.icons8.com/color/96/brain.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            margin: 0;
            transition: background 0.4s ease, color 0.4s ease;
        }
        body.light-mode {
            background: linear-gradient(135deg, #fdf4ff 0%, #e0e7ff 50%, #fbcfe8 100%) !important;
            color: #1e293b;
        }
        body.light-mode .joy-card {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px rgba(244, 114, 182, 0.15);
        }
        body.light-mode .joy-input {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #f472b6;
            color: #1e293b;
        }
        body.dark-mode {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311026 100%) !important;
            color: #f8fafc;
        }
        body.dark-mode .joy-card {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        body.dark-mode .joy-input {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #a855f7;
            color: #f8fafc;
        }
        body.dark-mode .joy-input::placeholder {
            color: #64748b;
        }
        .joy-btn {
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .joy-btn:hover {
            box-shadow: 0 15px 35px rgba(236, 72, 153, 0.6);
            transform: translateY(-3px) scale(1.02);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .floating-icon {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="light-mode flex items-center justify-center p-4">
    <div class="joy-card p-8 rounded-3xl max-w-md w-full text-center">
        <div class="floating-icon text-6xl mb-4">🧠</div>
        <h1 class="text-2xl font-bold mb-2">ذاكرتي البهية</h1>
        <p class="text-sm opacity-80 mb-6">رفيقك الذكي لاسترجاع ذكرياتك بكل حب وسهولة</p>
        <div class="joy-input p-4 rounded-xl mb-4 text-right">
            محتوى الموقع يعمل بكفاءة عالية!
        </div>
    </div>
</body>
</html>
